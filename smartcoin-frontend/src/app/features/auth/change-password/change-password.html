<div class="page" [class.embedded]="!mandatory" [attr.role]="mandatory ? 'main' : null">
  <mat-card appearance="outlined" class="card">
    <mat-card-header>
      <h1 class="title">Cambiar contraseña</h1>
    </mat-card-header>
    <mat-card-content>
      @if (mandatory) {
        <p class="notice">Tenés que cambiar la contraseña inicial antes de seguir.</p>
      }
      <app-change-password-form (changed)="onChanged()" />
    </mat-card-content>
    <mat-card-actions>
      @if (mandatory) {
        <button mat-button type="button" (click)="logout()">Cerrar sesión</button>
      } @else {
        <button mat-button type="button" (click)="cancel()">Cancelar</button>
      }
    </mat-card-actions>
  </mat-card>
</div>
