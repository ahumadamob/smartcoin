<h2 appDialogTitle>Consolidar «{{ entry.name }}» de {{ data.period | period }}</h2>

<div class="content">
  @if (loading()) {
    <p role="status">Cargando…</p>
  } @else if (loadError(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  } @else if (preview(); as current) {
    @if (error(); as message) {
      <p class="error" role="alert" data-testid="consolidate-error">{{ message }}</p>
    }

    @if (!current.allowed) {
      <p class="note" role="status" data-testid="blocked">{{ current.blockedDetail }}</p>
    } @else {
      <app-consolidation-outcome [preview]="current" [currency]="entry.currency" [(policy)]="policy" />
    }
  }
</div>

<div class="dialog-actions">
  <button pButton variant="text" severity="secondary" type="button" data-testid="cancel-consolidate" (click)="cancel()">
    Cancelar
  </button>
  <button
    pButton
    type="button"
    data-testid="confirm-consolidate"
    [disabled]="!canConfirm()"
    (click)="submit()"
  >
    Consolidar
  </button>
</div>
