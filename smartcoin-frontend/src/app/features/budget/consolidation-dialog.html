<h2 mat-dialog-title>Consolidar «{{ entry.name }}» de {{ data.period | period }}</h2>

<mat-dialog-content class="content">
  @if (loading()) {
    <p role="status">Cargando…</p>
  } @else if (loadError(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  } @else if (preview(); as current) {
    @if (error(); as message) {
      <p class="error" role="alert" data-testid="consolidate-error">{{ message }}</p>
    }

    @if (!current.allowed) {
      <p class="note" role="status" data-testid="blocked">{{ current.blockedDetail }}</p>
    } @else {
      <app-consolidation-outcome [preview]="current" [currency]="entry.currency" [(policy)]="policy" />
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" data-testid="cancel-consolidate" (click)="cancel()">Cancelar</button>
  <button
    mat-flat-button
    type="button"
    data-testid="confirm-consolidate"
    [disabled]="!canConfirm()"
    (click)="submit()"
  >
    Consolidar
  </button>
</mat-dialog-actions>
