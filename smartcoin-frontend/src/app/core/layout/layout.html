<div class="layout-wrapper">
  <header class="layout-topbar">
    <div class="layout-topbar-logo-container">
      <a class="layout-topbar-logo" routerLink="/presupuesto">Smartcoin</a>
    </div>
    <div class="layout-topbar-actions">
      <app-user-menu />
    </div>
  </header>

  <div class="layout-sidebar">
    <nav aria-label="Principal">
      <ul class="layout-menu">
        @for (item of navItems; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active-route" ariaCurrentWhenActive="page">
              <i [class]="'pi ' + item.icon + ' layout-menuitem-icon'" aria-hidden="true"></i>
              <span class="layout-menuitem-text">{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>

  <div class="layout-main-container">
    <main class="layout-main">
      <router-outlet />
    </main>
  </div>
</div>
<!-- Avisos (Notices). Se anuncian como `status`, como el snackbar de Material: no interrumpen al lector de pantalla. -->
<p-toast position="top-right" [pt]="toastPt">
  <ng-template #message let-message>
    <div class="notice">
      <p class="notice-text">{{ message.detail }}</p>
      @if (message.data?.action; as action) {
        <button pButton type="button" size="small" severity="secondary" (click)="notices.runAction(action)">
          {{ action.label }}
        </button>
      }
    </div>
  </ng-template>
</p-toast>
