<button
  pButton
  type="button"
  class="trigger"
  variant="text"
  severity="secondary"
  [cdkMenuTriggerFor]="menu"
  [cdkMenuPosition]="positions"
  [attr.title]="email()"
>
  <i class="pi pi-user" aria-hidden="true"></i>
  <span class="label">{{ email() ?? fallbackLabel }}</span>
  <i class="pi pi-angle-down" aria-hidden="true"></i>
</button>
<ng-template #menu>
  <div class="user-menu-panel" cdkMenu aria-label="Menú de usuario">
    <button type="button" class="user-menu-item" cdkMenuItem (cdkMenuItemTriggered)="changePassword()">
      <i class="pi pi-key" aria-hidden="true"></i>
      <span>Cambiar contraseña</span>
    </button>
    <button type="button" class="user-menu-item" cdkMenuItem (cdkMenuItemTriggered)="logout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</ng-template>
