<button
  pButton
  type="button"
  class="trigger"
  variant="text"
  severity="secondary"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? 'user-menu' : null"
  [attr.title]="email()"
  (click)="menu.toggle($event)"
>
  <i class="pi pi-user" aria-hidden="true"></i>
  <span class="label">{{ email() ?? fallbackLabel }}</span>
  <i class="pi pi-angle-down" aria-hidden="true"></i>
</button>
<p-menu
  #menu
  id="user-menu"
  [model]="items"
  [popup]="true"
  appendTo="body"
  ariaLabel="Menú de usuario"
  (onShow)="open.set(true)"
  (onHide)="open.set(false)"
/>
