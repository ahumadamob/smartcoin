spring:
  application:
    name: smartcoin-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/{vendor}
    clean-disabled: true

app:
  zone: America/Argentina/Mendoza
  budget:
    horizon-months: 24
    early-days: 10
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-expiration: 8h
    admin-key: ${APP_ADMIN_KEY:}
    password-min-length: 10
